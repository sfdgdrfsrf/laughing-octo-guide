name: Android ARM64 Lua Hook Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Fixed: Uses a dedicated NDK toolchain setup, bypassing the broken legacy 'tools' requirement entirely
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        local-cache: true

    - name: Configure CMake and Build Native Library
      run: |
        mkdir -p build && cd build
        cmake \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release \
          ..
        make

    - name: Upload Compiled Shared Object Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-lua-hook-arm64
        path: build/*.so
